# Dependabot configuration for automatic security updates
# This tells GitHub to automatically create PRs when vulnerabilities are found

version: 2
updates:
  # Monitor Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "skehan0"
    commit-message:
      prefix: "security"
      include: "scope"

  # Monitor Node.js dependencies  
  - package-ecosystem: "npm"
    directory: "/tradely"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "skehan0"
    commit-message:
      prefix: "security"
      include: "scope"

  # Monitor Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    assignees:
      - "skehan0"
    commit-message:
      prefix: "security"
      include: "scope"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    assignees:
      - "skehan0"
    commit-message:
      prefix: "security"
      include: "scope"