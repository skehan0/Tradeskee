# This is our CI/CD pipeline - it runs automatically when you push code
name: "AI Stock Analyzer CI/CD"

# When should this run? (Triggers)
on:
  push:
    branches: [ main, feature/ci-cd ]
  pull_request:
    branches: [ main ]

# Environment variables available to all jobs
env:
  AZURE_REGISTRY: fypstockanalyzer.azurecr.io
  BACKEND_IMAGE: fyp-backend
  FRONTEND_IMAGE: fyp-frontend

jobs:
  # Job 1: Test our Python code
  test:
    name: "Test Python Code"
    runs-on: ubuntu-latest
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
    
    - name: "Set up Python 3.12"
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: "Run tests"
      run: |
        echo "Tests would run here!"
        # python -m pytest src/test/ -v
    
    - name: "Lint code"
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: "Security scan"
      run: |
        pip install safety bandit
        safety check --json || true
        bandit -r src/ -f json || true

  # Job 2: Build and test Docker containers
  test-docker:
    name: "Test Docker Build"
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@v3

    - name: "Build backend image (test only)"
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: test:backend

    - name: "Build frontend image (test only)"
      uses: docker/build-push-action@v5
      with:
        context: ./tradely
        file: ./tradely/Dockerfile
        push: false
        tags: test:frontend

    - name: "Test containers start"
      run: |
        echo "Container build tests passed!"

  # Job 3: Security scan
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    - name: "Audit npm dependencies"
      working-directory: ./tradely
      run: |
        npm audit --audit-level high || true
        
    - name: "Scan for secrets"
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD