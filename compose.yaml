services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fyp-backend
    ports:
      - "8000:8000"   # expose backend to host
    environment:
      - MONGODB_URI=mongodb://mongo:27017/tradely
      - LLM_API_URL=http://ollama:11434/api/chat
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
    depends_on:
      - mongo
      - ollama

  frontend:
    build:
      context: ./tradely
      dockerfile: Dockerfile
    container_name: fyp-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000  # backend container name, not localhost
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: fyp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: fyp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongo_data:
  ollama_data:
