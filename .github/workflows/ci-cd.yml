# This is our CI/CD pipeline - it runs automatically when you push code
name: "AI Stock Analyzer CI/CD"

# When should this run? (Triggers)
on:
  push:
    branches: [ main, feature/ci-cd ]  # Run on pushes to these branches
  pull_request:
    branches: [ main ]  # Run on PRs to main

# Environment variables available to all jobs
env:
  AZURE_REGISTRY: fypstockanalyzer.azurecr.io  # Azure Container Registry
  BACKEND_IMAGE: fyp-backend
  FRONTEND_IMAGE: fyp-frontend

# Jobs are the main work units
jobs:
  # Job 1: Test our Python code
  test:
    name: "Test Python Code"
    runs-on: ubuntu-latest  # Free GitHub runner
    
    steps:
    # Step 1: Get our code
    - name: "Checkout code"
      uses: actions/checkout@v4
    
    # Step 2: Set up Python environment
    - name: "Set up Python 3.12"
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    # Step 3: Install dependencies
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Step 4: Run tests (we'll add these later)
    - name: "Run tests"
      run: |
        echo "Tests would run here!"
        # python -m pytest src/test/ -v
    
    # Step 5: Check code quality
    - name: "Lint code"
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    # Step 6: Security scan for Python dependencies
    - name: "Security scan"
      run: |
        pip install safety bandit
        safety check --json || true
        bandit -r src/ -f json || true

  # Job 2: Build and test our Docker containers
  test-docker:
    name: "Test Docker Build"
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@v3

    # Test that our Docker images build successfully
    - name: "Build backend image (test only)"
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false  # Don't push yet, just test build
        tags: test:backend

    - name: "Build frontend image (test only)"
      uses: docker/build-push-action@v5
      with:
        context: ./tradely
        file: ./tradely/Dockerfile
        push: false  # Don't push yet, just test build
        tags: test:frontend

    # Test that containers actually start
    - name: "Test containers start"
      run: |
        echo "Container build tests passed!"

  # Job 3: Security scan for frontend dependencies
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    # Scan Node.js dependencies
    - name: "Audit npm dependencies"
      working-directory: ./tradely
      run: |
        npm audit --audit-level high || true
        
    # Scan for secrets in code
    - name: "Scan for secrets"
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD

  # Job 4: Build and push to Azure Container Registry (only on main branch)
  build-and-push:
    name: "Build & Push to Azure"
    runs-on: ubuntu-latest
    needs: [test-docker, security-scan]
    if: github.ref == 'refs/heads/main'  # Only run on main branch
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
    
    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@v3
    
    # Login to Azure Container Registry
    - name: "Login to Azure Container Registry"
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.AZURE_REGISTRY }}
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
    
    # Build and push backend image
    - name: "Build and push backend"
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.AZURE_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          ${{ env.AZURE_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
    
    # Build and push frontend image
    - name: "Build and push frontend"
      uses: docker/build-push-action@v5
      with:
        context: ./tradely
        file: ./tradely/Dockerfile
        push: true
        tags: |
          ${{ env.AZURE_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.AZURE_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # Job 5: Deploy to Azure Container Instances (Staging)
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging  # GitHub environment protection
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
    
    - name: "Azure Login"
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: "Deploy to Azure Container Instances"
      run: |
        # Deploy our backend container
        az container create \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name fyp-backend-staging \
          --image ${{ env.AZURE_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          --cpu 1 --memory 2 \
          --ports 8000 \
          --dns-name-label fyp-backend-staging-${{ github.run_number }} \
          --environment-variables \
            NODE_ENV=staging \
            DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }} \
          --restart-policy OnFailure
        
        echo "Staging deployment complete!"
        echo "Backend URL: http://fyp-backend-staging-${{ github.run_number }}.eastus.azurecontainer.io:8000"

  # Job 6: Deploy to Production (manual approval required)
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production  # Requires manual approval
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
    
    - name: "Azure Login"
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: "Deploy to Production"
      run: |
        # Deploy production containers with higher resources
        az container create \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name fyp-backend-production \
          --image ${{ env.AZURE_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          --cpu 2 --memory 4 \
          --ports 8000 \
          --dns-name-label fyp-backend-prod \
          --environment-variables \
            NODE_ENV=production \
            DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }} \
          --restart-policy OnFailure
        
        echo "Production deployment complete!"
        echo "Production URL: http://fyp-backend-prod.eastus.azurecontainer.io:8000"