# This is our CI/CD pipeline - it runs automatically when you push code
name: "AI Stock Analyzer CI/CD"

# Prevent multiple parallel runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# When should this run? (Triggers)
on:
  push:
    branches: [ main, feature/ci-cd ]
  pull_request:
    branches: [ main ]

# Environment variables available to all jobs
env:
  AZURE_REGISTRY: fypstockanalyzer.azurecr.io
  BACKEND_IMAGE: fyp-backend
  FRONTEND_IMAGE: fyp-frontend

jobs:
  # Job 1: Test our Python code
  test:
    name: "Test Python Code"
    runs-on: ubuntu-latest
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
    
    - name: "Set up Python 3.12"
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: "Cache pip dependencies"
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
    
    - name: "Run tests"
      env:
        TESTING: true
        ALPHA_VANTAGE_API_KEY: test_key
        MONGODB_URI: mongodb://localhost:27017/test
        OLLAMA_BASE_URL: http://localhost:11434
      run: |
        python -m pytest src/test/ -v
        
    - name: "Test frontend build"
      working-directory: ./tradely
      continue-on-error: true
      run: |
        npm ci
        npm run build --if-present
        npm test --if-present --passWithNoTests
    
    - name: "Lint code"
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82,F821 --show-source --statistics --max-line-length=100

    - name: "Security scan"
      run: |
        pip install safety bandit
        safety check --json || true
        bandit -r src/ -f json || true

  # Job 2: Build and test Docker containers
  test-docker:
    name: "Test Docker Build"
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@v3

    - name: "Build backend image (test only)"
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: test:backend

    - name: "Build frontend image (test only)"
      uses: docker/build-push-action@v5
      with:
        context: ./tradely
        file: ./tradely/Dockerfile
        push: false
        tags: test:frontend

    - name: "Test containers start"
      run: |
        echo "Container build tests passed!"

  # Job 3: Security scan
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
      
    - name: "Cache npm dependencies"
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: "Audit npm dependencies"
      working-directory: ./tradely
      run: |
        npm audit --audit-level high || true
        
    - name: "Scan for secrets"
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD